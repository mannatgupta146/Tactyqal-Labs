services:
  - type: web
    name: tactyqal-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://tactyqal-labs-kappa.vercel.app
      - key: MONGODB_URI
        sync: false
